name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 预装了 Android SDK（$ANDROID_SDK_ROOT + cmdline-tools），
      # 直接用它的 sdkmanager 装所需组件即可 —— 不用第三方 action（它还在装已下线的 tools 包，会失败）
      - name: 安装 Android SDK 组件（build-tools;34.0.0 + platforms;android-34）
        run: |
          set -e
          SDKMANAGER=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -n "$SDKMANAGER" ] || { echo "找不到 sdkmanager"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          ls "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_SDK_ROOT/platforms"

      - name: 拉取构建依赖（r8/D8）
        run: ./scripts/fetch-deps.sh

      - name: 生成临时签名密钥（CI 用，不涉及任何私钥）
        env:
          KS_PASS: ci-throwaway
        run: |
          keytool -genkeypair -keystore updater/app.p12 -storetype PKCS12 -alias simus \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=simus-updater-ci"

      - name: 构建打包引擎
        run: ./updater/build-engine.sh

      - name: 构建 App
        env:
          KS_PASS: ci-throwaway
        run: ./updater/build-app.sh

      - name: 构建 Xposed 模块
        env:
          KS_PASS: ci-throwaway
        run: ./module/build-module.sh

      - name: 校验产物
        run: |
          set -e
          ls -la updater/simusupdater.apk "module/simspoof-US模块.apk"
          DEXDUMP=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/dexdump 2>/dev/null | sort -V | tail -1)
          [ -n "$DEXDUMP" ] || { echo "找不到 dexdump"; exit 1; }
          rm -rf /tmp/modchk && mkdir -p /tmp/modchk
          unzip -o -q "module/simspoof-US模块.apk" classes.dex -d /tmp/modchk
          CLASSES=$("$DEXDUMP" -d /tmp/modchk/classes.dex | grep "Class descriptor" | sed 's/.*: //')
          echo "模块里定义的类："; echo "$CLASSES"
          # 模块里绝不能【定义】Xposed API 类（LSPatch 的 VectorLegacyBridge 会拒绝加载这种模块）。
          # 注意：仅仅“引用”这些类型是正常的 —— 运行时由 loader 提供。
          if echo "$CLASSES" | grep -q 'de/robv/android/xposed'; then
            echo "!!! 模块里定义了 Xposed API 类（桩类被打进 dex 了）"; exit 1
          fi
          echo "$CLASSES" | grep -q 'io/nidome/simspoof/SpoofModule' || { echo "!!! 缺模块主类"; exit 1; }
          # App 里必须带着 loader 与内嵌模块
          unzip -l updater/simusupdater.apk | grep -q 'assets/lspatch/loader.dex'
          unzip -l updater/simusupdater.apk | grep -q 'assets/simspoof.apk'
          echo "产物校验通过"
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            updater/simusupdater.apk
            module/simspoof-US模块.apk
          if-no-files-found: error
