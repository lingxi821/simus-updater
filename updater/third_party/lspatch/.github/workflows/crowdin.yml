name: Crowdin Action

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
    # Source strings only (the *-values folder, not translated *-values-xx ones). The shared UI
    # strings live in the core submodule and sync from its own workflow, so they are not listed here.
    - manager/src/main/res/values/strings.xml
    - manager/src/main/res/values/strings_logservice.xml

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: crowdin action
      uses: crowdin/github-action@master
      with:
        upload_translations: true
        download_translations: false
        upload_sources: true
        config: 'crowdin.yml'
        crowdin_branch_name: master
      env:
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
