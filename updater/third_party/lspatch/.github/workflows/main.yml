name: Android CI

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # A "Release LSPatch v…" commit is cut straight to a v* tag, which builds and publishes it. Skip
    # its redundant master-push build entirely so the same code never builds (or canaries) twice.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release LSPatch v')) }}
    permissions:
      contents: write # publish canary prereleases and tagged releases
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
      CCACHE_BASEDIR: '${{ github.workspace }}'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Write key
      if: github.event_name != 'pull_request'
      run: |
        if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
        fi

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
      with:
        version: 1.12.0

    - name: Remove Android's cmake
      shell: bash
      run: rm -rf $ANDROID_HOME/cmake

    - name: Set short commit id
      run: echo "commit=$(echo ${{ github.sha }} | cut -c-7)" > $GITHUB_ENV

    - name: Build with Gradle
      run: |
        {
          echo 'org.gradle.parallel=true'
          echo 'org.gradle.jvmargs=-Xmx2048m'
          echo 'android.native.buildOutput=verbose'
        } >> gradle.properties
        ./gradlew buildAll

    - name: Upload Debug artifact
      uses: actions/upload-artifact@v7
      with:
        name: lspatch-debug-${{ env.commit }}
        path: out/debug/*

    - name: Upload Release artifact
      uses: actions/upload-artifact@v7
      with:
        name: lspatch-release-${{ env.commit }}
        path: out/release/*

    - name: Upload mappings
      uses: actions/upload-artifact@v7
      with:
        name: mappings-${{ env.commit }}
        path: |
          patch-loader/build/outputs/mapping
          manager/build/outputs/mapping

    - name: Upload symbols
      uses: actions/upload-artifact@v7
      with:
        name: symbols-${{ env.commit }}
        path: |
          patch-loader/build/symbols

    # --- stable release (pushed v* tag) --------------------------------------------------------
    #
    # `git tag vX && git push --tags` publishes the release here from the very apk/jar this build
    # produced — nothing is hand-uploaded, so the assets can never drift from what was built. The
    # release is named by its tag, the notes come from CHANGELOG.md in the repo (overwritten per
    # release), and both the release and debug outputs are attached. Bump verName before tagging.
    - name: Publish release
      if: ${{ success() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        # `%s` argument, never the format string, so a `%` anywhere in the changelog stays literal.
        # CHANGELOG.md is optional -- an absent one just leaves the notes as the tag header.
        notes=$(printf '# LSPatch %s\n\n%s\n' "${TAG}" "$(cat CHANGELOG.md 2>/dev/null || true)")
        # Collect the built assets by their real names and fail loudly if the apk or jar is missing,
        # rather than letting a glob publish a half-empty release. Both variants are attached.
        shopt -s nullglob
        assets=(out/release/manager-*.apk out/release/lspatch-*.jar out/debug/manager-*.apk out/debug/lspatch-*.jar)
        ls out/release/manager-*.apk >/dev/null 2>&1 || { echo "::error::no release manager APK built"; exit 1; }
        ls out/release/lspatch-*.jar >/dev/null 2>&1 || { echo "::error::no release lspatch jar built"; exit 1; }
        # Recreated rather than edited so a re-run replaces the assets instead of appending a second
        # copy. No --cleanup-tag: the release is rebuilt, the pushed release tag is kept.
        gh release delete "$TAG" --yes 2>/dev/null || true
        gh release create "$TAG" \
          --latest \
          --title "LSPatch ${TAG}" \
          --notes "$notes" \
          "${assets[@]}"

    # --- canary distribution (master push) -----------------------------------------------------
    #
    # The apk/jar are also attached to a rolling prerelease so testers can download without a GitHub
    # account: an Actions artifact 401s an anonymous caller, a release asset does not. Marked
    # prerelease so releases/latest keeps pointing at the last stable tag. Release commits never reach
    # here — the job-level `if` skips their master build outright.
    - name: Publish canary prerelease
      if: >-
        success() &&
        (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' && github.ref == 'refs/heads/master'))
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        set -euo pipefail
        code=$(git rev-list HEAD --count)
        short=$(git rev-parse --short HEAD)
        subject=$(git log -1 --pretty=%s)
        tag="canary-${code}"
        notes=$(cat <<EOF
        **${subject}**

        Built from [\`${short}\`](${COMMIT_URL}) by [run ${{ github.run_id }}](${RUN_URL}).

        A canary — the current state of \`master\`, tested by CI and nothing else, published as a
        prerelease so it can be downloaded without a GitHub account.

        | Build | Use it when |
        | :-- | :-- |
        | \`…-debug.apk\` / \`…-debug.jar\` | Chasing a bug — far more logging. |
        | \`…-release.apk\` / \`…-release.jar\` | You just want the newest code. |

        Only the five most recent canaries are kept.
        EOF
        )
        # Collect the built assets by their real names and fail loudly if the apk or jar is missing,
        # rather than letting a glob publish a canary without its manager APK. Both variants attach.
        shopt -s nullglob
        assets=(out/release/manager-*.apk out/release/lspatch-*.jar out/debug/manager-*.apk out/debug/lspatch-*.jar)
        ls out/release/manager-*.apk >/dev/null 2>&1 || { echo "::error::no release manager APK built"; exit 1; }
        ls out/release/lspatch-*.jar >/dev/null 2>&1 || { echo "::error::no release lspatch jar built"; exit 1; }
        # Recreate rather than edit so a re-run replaces the build instead of appending assets.
        gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$tag" \
          --prerelease \
          --target "${{ github.sha }}" \
          --title "LSPatch canary ${code}" \
          --notes "$notes" \
          "${assets[@]}"

    # Five is enough to bisect a regression; sorted by version code (commit count, monotonic), not
    # date, which reruns and reverts can disorder.
    - name: Keep only the five most recent canaries
      if: >-
        success() &&
        (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' && github.ref == 'refs/heads/master'))
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^canary-' || true)
        [ -n "$tags" ] || exit 0
        echo "$tags" | sort -t- -k2 -n -r | tail -n +6 | while read -r old; do
          echo "Removing $old"
          gh release delete "$old" --yes --cleanup-tag
        done
