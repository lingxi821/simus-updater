android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
# This build configures the Android extensions through the legacy BaseExtension DSL (see the
# configureBaseExtension helper in build.gradle.kts); AGP 9 ignores that unless the new DSL is off.
android.newDsl=false
# The Compose compiler in :manager needs more heap than a daemon's default, and native builds are large.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# KSP still registers its generated sources through the kotlin.sourceSets DSL, which AGP 9's built-in
# Kotlin rejects by default; allow it until the KSP integration stops using that DSL.
android.disallowKotlinSourceSets=false
