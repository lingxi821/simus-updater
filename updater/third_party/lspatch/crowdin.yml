project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_API_TOKEN
base_path: .
base_url: 'https://api.crowdin.com'
pull_request_title: '[translation] Update translation from Crowdin'
preserve_hierarchy: 1

# %two_letters_code% rather than %android_code%: %android_code% is region-qualified for every
# language, while a resource folder carries a region only where one is needed to disambiguate. The
# two-letter code already agrees with the unqualified folders, so only the exceptions below need a
# mapping entry — kept in step with the project's language settings, which expand the pattern
# server-side.
# Only LSPatch's own strings are translated here. The shared UI strings live in the `core`
# submodule (core/manager-ui) and are translated through that project's own crowdin.yml, then
# arrive prebuilt in the library — LSPatch never re-translates them. strings_untranslatable.xml is
# excluded by design.
files:
  - source: /manager/src/main/res/values/strings.xml
    translation: /manager/src/main/res/values-%two_letters_code%/%original_file_name%
    type: android
    languages_mapping: &resource_folders
      two_letters_code:
        'id': 'in'          # Android kept the superseded ISO code
        'he': 'iw'          # likewise
        'pt-BR': 'pt-rBR'   # the unqualified code denotes the European variant
        'zh-CN': 'zh-rCN'
        'zh-HK': 'zh-rHK'
        'zh-TW': 'zh-rTW'
  - source: /manager/src/main/res/values/strings_logservice.xml
    translation: /manager/src/main/res/values-%two_letters_code%/%original_file_name%
    type: android
    languages_mapping: *resource_folders
